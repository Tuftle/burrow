[package]
name = "burrow-setup"
version = "0.2.0"
edition = "2021"
description = "The Burrow installer: a small branded window that puts burrow.exe in place"

[dependencies]
eframe = { version = "0.31", default-features = false, features = ["glow", "default_fonts"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[build-dependencies]
winres = "0.1"
